[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vizion"
version = "0.1.0"
description = "Framework-independent neural network diagrams"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aggdraw>=1.3.16",
    "numpy>=1.23",
    "pillow>=9.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Upstream = "https://github.com/paulgavrikov/visualkeras"

[tool.setuptools]
packages = ["vizion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
